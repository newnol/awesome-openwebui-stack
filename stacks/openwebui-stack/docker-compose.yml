services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    container_name: open-webui
    ports:
      - "127.0.0.1:3000:8080"
    restart: always
    env_file:
      - .env
    environment:
      - ENABLE_VERSION_UPDATE_CHECK=false
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      - ENABLE_ADMIN_CHAT_ACCESS=false
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
    volumes:
      - open-webui:/app/backend/data
    networks:
      - ai-network

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:0.17.7
    container_name: open-terminal
    ports:
      - "127.0.0.1:18000:8000"
    restart: unless-stopped
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY:?Set OPEN_TERMINAL_API_KEY in .env}
    volumes:
      - open-terminal:/home/user
    networks:
      - ai-network

  litellm:
    image: ghcr.io/berriai/litellm:v1.109.1
    volumes:
      - ./config.yaml:/app/litellm-config.yaml
    command: ["--config", "/app/litellm-config.yaml"]
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://llmproxy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
    env_file:
      - .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-network

  db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - ai-network

volumes:
  open-webui:
  open-terminal:
  postgres_data:

networks:
  ai-network:
    external: true
