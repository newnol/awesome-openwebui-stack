name: Add pipe
description: Suggest a pipe (model routing, custom pipeline) for the catalog
title: "[Pipe] "
labels: ["catalog", "pipe"]
body:
  - type: markdown
    attributes:
      value: |
        List **finished**, installable pipes with a stable **source** link. This catalog is a showcase—not a tutorial repo. Entries land in `catalog/pipes.md`. See `docs/submission-guidelines.md`.
  - type: input
    id: name
    attributes:
      label: Pipe name
      description: Official name as shown in docs or repo.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL
      description: Repository or documentation link.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: One or two sentences (e.g. route requests by rules).
    validations:
      required: true
  - type: textarea
    id: best-for
    attributes:
      label: Best for
      description: Use cases (e.g. multi-model routing, cost control).
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: See docs/category-guide.md (e.g. Multi-agent, Automation).
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Stable
        - Beta
        - Experimental
        - Unmaintained
        - Unknown
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: License, dependencies (e.g. LiteLLM), or Open WebUI version notes.
