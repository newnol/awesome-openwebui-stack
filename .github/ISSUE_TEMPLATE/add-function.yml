name: Add function
description: Suggest a function (filter, action, etc.) for the catalog
title: "[Function] "
labels: ["catalog", "function"]
body:
  - type: markdown
    attributes:
      value: |
        List **finished**, installable functions with a stable **source** link. This catalog is a showcase—not a tutorial repo. Entries land in `catalog/functions.md`. See `docs/submission-guidelines.md`.
  - type: input
    id: name
    attributes:
      label: Function name
      description: Official name as shown in docs or repo.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source URL
      description: Repository or documentation link.
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: best-for
    attributes:
      label: Best for
      description: Use cases (e.g. moderation, formatting, guardrails).
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: See docs/category-guide.md (e.g. Automation, Productivity).
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Stable
        - Beta
        - Experimental
        - Unmaintained
        - Unknown
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: License, setup caveats, or Open WebUI version notes.
