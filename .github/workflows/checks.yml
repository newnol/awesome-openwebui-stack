name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog validation and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/catalog.test.mjs
      - run: node scripts/catalog.mjs --check
      - run: python -m pip install jsonschema==4.26.0
      - run: python scripts/check_schema.py
      - name: Upload static site for review
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          retention-days: 7
          include-hidden-files: true
          path: |
            index.html
            guide.html
            .nojekyll
            _sidebar.md
            assets/
            data/
            catalog/
            categories/
            docs/
            stacks/
            README*.md
            START-HERE*.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            LICENSE

  browser:
    name: Browser regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'browser_test.py' -v
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  links:
    name: Dead link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --verbose --exclude-path _sidebar.md './**/*.md'
          fail: true

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown with markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'
